name: Verify and release Shixu for Mac

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: shixu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Test and build Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve release policy
        id: release
        run: node scripts/release-policy.js
      - run: npm ci
      - run: npm run build:native
      - run: npm test
      - name: Verify new workflows with isolated mock services
        run: node scripts/run-shixu-check.js
      - name: Build DMG
        run: npm run build
      - name: Verify and checksum DMG
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          codesign --verify --deep --strict 'dist.noindex/mac-arm64/拾序.app'
          hdiutil verify "dist.noindex/Shixu-${version}-arm64.dmg"
          cd dist.noindex
          LC_ALL=C shasum -a 256 "Shixu-${version}-arm64.dmg" > "Shixu-${version}-arm64.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: shixu-mac-installer
          path: |
            dist.noindex/*.dmg
            dist.noindex/*.dmg.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "${GITHUB_REF_NAME}" \
            "dist.noindex/Shixu-${version}-arm64.dmg" \
            "dist.noindex/Shixu-${version}-arm64.dmg.sha256" \
            --verify-tag --latest --title "拾序 ${GITHUB_REF_NAME} · Mac 试用版" \
            --notes-file docs/release-notes.md
